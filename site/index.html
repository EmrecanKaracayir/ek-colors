<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EK Colors</title>
<meta name="description" content="EK Colors solves accessible color palettes in CAM16: every color exactly on its APCA contrast, equally colorful and evenly spaced, for light and dark and three kinds of screen. It ships with EK Palette.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* One view at a time on the mode's own base: the page is the background the colors are solved for. */
  :root {
    --base-light: #EBEBEB;
    --base-dark: #181818;
    --bg: var(--base-light);
    --fg: #1C1D20;
    --soft: #5E6066;
    --line: rgb(28 29 32 / 0.14);
    --raised: rgb(255 255 255 / 0.55);
    /* Each mode's text color, the same in both themes, for showing one mode inside the other. */
    --fg-light: #1C1D20;
    --fg-dark: #E7E8EA;
    /* What a raised panel casts: a soft dark shadow, the same in both themes. */
    --shadow: rgb(0 0 0 / 0.2);
    /* What a control under the pointer is filled with; made from the text color, so it fits both themes. */
    --hover: color-mix(in oklch, var(--fg) 4%, transparent);
    --focus: #0A62C9;
    --good: #1F7A3A;
    --fair: #8A6100;
    --poor: #B3261E;
    --sans: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--base-dark); --fg: #E7E8EA; --soft: #9C9EA4; --line: rgb(231 232 234 / 0.14);
      --raised: rgb(255 255 255 / 0.05); --focus: #6FB1FF; --good: #6CCB86; --fair: #E0B455; --poor: #FF8A80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--base-dark); --fg: #E7E8EA; --soft: #9C9EA4; --line: rgb(231 232 234 / 0.14);
    --raised: rgb(255 255 255 / 0.05); --focus: #6FB1FF; --good: #6CCB86; --fair: #E0B455; --poor: #FF8A80;
    color-scheme: dark;
  }

  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 1rem/1.5 var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: background-color 0.2s;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  * { box-sizing: border-box; scrollbar-width: thin; }
  [hidden] { display: none !important; }
  a { color: inherit; }
  /* Clickable text: faint dots show it does something; under the pointer, or while its popover is
     open, they turn as strong as the text. Controls drawn as buttons, tabs or chips don't use it. */
  a, button.link, .copy, .pop-trigger:is(.wanted, .metric, .metric-scope, .strip-gap) { text-decoration: underline dotted color-mix(in oklch, currentColor 45%, transparent); text-underline-offset: 0.2em; }
  :is(a, button.link, .copy, .pop-trigger:is(.wanted, .metric, .metric-scope, .strip-gap)):is(:hover, [aria-expanded="true"]) { text-decoration-color: currentColor; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  .soft { color: var(--soft); font-weight: 400; }

  /* Bar */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); border-bottom: 1px solid var(--line);
    /* Name on the left, views centered, status on the right; the switches below, centered too. */
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 0.5rem 1.5rem;
    padding-block: 0.75rem; max-width: 72rem; margin: 0 auto;
  }
  .brand { justify-self: start; font-weight: 600; text-decoration: none; letter-spacing: -0.01em; }
  .nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem; }
  .nav a { text-decoration: none; padding: 0.375rem 0.625rem; border-radius: 0.5rem; color: var(--soft); }
  .nav a:hover { color: var(--fg); }
  .nav a:not([aria-current]):hover { background: var(--hover); }
  .nav a[aria-current] { color: var(--fg); background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
  .tools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem 1.25rem; }
  .tool { display: inline-flex; gap: 0.375rem; align-items: center; flex: none; }
  .tool-label { font-size: 0.75rem; color: var(--soft); }
  .tool-info { width: 1.5rem; height: 1.5rem; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--soft); font-size: 0.875rem; line-height: 1; }
  .tool-info:hover, .tool-info[aria-expanded="true"] { color: var(--fg); }
  #status { justify-self: end; font-size: 0.8125rem; color: var(--soft); }
  .menu-toggle { display: none; }
  #status[data-state="busy"]::before { content: "● "; color: var(--fair); }
  #status[data-state="error"] { color: var(--poor); }

  .segmented { display: inline-flex; border-radius: 0.5rem; box-shadow: inset 0 0 0 1px var(--line); padding: 1px; }
  button { font: inherit; font-size: 0.875rem; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.375rem 0.75rem; cursor: pointer; }
  .segmented button { border: 0; background: none; color: var(--soft); padding: 0.125rem 0.5rem; border-radius: 0.4375rem; font-size: 0.8125rem; line-height: 1.4; }
  .segmented button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
  /* Under the pointer: buttons, dropdowns and text fields add the hover fill over their own; a toggle that isn't
     chosen fills and takes the full text color. A button whose class gives it its own background,
     like a test swatch, keeps it. */
  button:where(:hover:not(:disabled)), a.button:hover, select:hover:not(:disabled), input:is([type="number"], [type="text"]):hover:not(:disabled), textarea:hover { background: linear-gradient(var(--hover), var(--hover)), var(--raised); }
  .segmented button:not([aria-pressed="true"]):hover { color: var(--fg); background: var(--hover); }

  /* Page */
  main { max-width: 72rem; margin: 0 auto; padding-block: 2rem 4rem; display: grid; gap: 3rem; }
  section { display: grid; gap: 1rem; min-width: 0; }
  h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; margin: 0; text-wrap: balance; }
  h2 { font-size: 1.25rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h3 { font-size: 0.8125rem; font-weight: 500; margin: 0; text-transform: uppercase; letter-spacing: 0.06em; color: var(--soft); }
  p { margin: 0; max-width: 65ch; }
  .intro { gap: 0.75rem; }
  .intro p { font-size: 1.0625rem; color: var(--soft); }
  .hero h1 { color: var(--c); }

  /* Cards: the color as a fill, as text, and its numbers */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: 1rem; }
  .card { position: relative; display: grid; gap: 0.25rem; align-content: start; text-decoration: none; padding: 0.75rem; border-radius: 0.875rem; box-shadow: inset 0 0 0 1px var(--line); }
  .card.linked:hover { background: var(--raised); }
  .card-link { position: absolute; inset: 0; border-radius: inherit; }
  .card-link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .chips.stack { display: inline-grid; justify-items: start; gap: 0.25rem; margin: 0 0 0 0.25rem; }
  .card-name { display: flex; gap: 0.375rem; align-items: center; justify-content: space-between; font-weight: 600; }
  .card-name .chip { position: relative; z-index: 1; font-size: 0.625rem; padding: 0 0.35rem; }
  .pop-trigger.wanted { position: relative; z-index: 1; font: inherit; color: var(--poor); background: none; border: 0; padding: 0; cursor: pointer; }
  .pop-trigger.chip { font-size: 0.6875rem; font-weight: 500; line-height: 1.5; color: var(--fair); background: none; border: 1px solid color-mix(in oklch, currentColor 55%, transparent); border-radius: 999px; padding: 0 0.45rem; cursor: pointer; }
  .pop-trigger.chip:hover, .pop-trigger.chip[aria-expanded="true"] { background: color-mix(in oklch, currentColor 14%, var(--bg)); }
  .pop-trigger.chip.gamut { color: var(--poor); }
  .pop-trigger.chip.lowered { color: var(--soft); }
  .pop-trigger.wanted.lowered { color: inherit; }
  .fill { display: block; height: 3.5rem; border-radius: 0.5rem; background: var(--c); margin-bottom: 0.25rem; }
  .small .fill { height: 2.25rem; }
  .sample { color: var(--c); font-size: 2rem; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  .small .sample { font-size: 1.5rem; }
  .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
  td > .facts { flex-wrap: nowrap; }
  .card .soft.mono { font-size: 0.75rem; }
  .limit { color: var(--fair); font-size: 0.75rem; font-weight: 500; }
  .copy { position: relative; z-index: 1; justify-self: start; max-width: 100%; font-size: inherit; color: inherit; text-align: left; overflow-wrap: anywhere; background: none; border: 0; padding: 0; cursor: copy; }
  .card .copy { font-size: 0.6875rem; }
  .small .copy { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .segmented button[title="This screen"]::after { content: " •"; color: var(--good); }
  .beyond { max-width: 72rem; margin: 1rem auto 0; padding: 0.625rem 0.875rem; border-radius: 0.625rem; box-shadow: inset 0 0 0 1px var(--fair); color: var(--fair); font-size: 0.875rem; }

  .badge { position: relative; z-index: 1; font-family: inherit; font-size: 0.6875rem; font-weight: 600; line-height: 1.5; letter-spacing: 0.04em; padding: 0.0625rem 0.375rem; background: none; border: 0; border-radius: 999px; box-shadow: inset 0 0 0 1px currentColor; white-space: nowrap; cursor: pointer; }
  .badge:hover, .badge[aria-expanded="true"] { background: color-mix(in oklch, currentColor 14%, var(--bg)); }
  .badge.AAA, .badge.AA, .level.AAA, .level.AA { color: var(--good); }
  .badge.AA-large, .level.AA-large { color: var(--fair); }
  .badge.below, .level.below { color: var(--soft); }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; align-items: center; }
  .split.even { align-items: start; }
  .circle { width: 100%; max-width: 26rem; display: block; margin: 0 auto; }
  .circle-block { margin: 0; display: grid; gap: 0.5rem; width: 100%; }
  .circle-block .guide-row { grid-column: auto; width: min(100%, 26rem); margin: 0 auto; }
  .circle-block .guide-picker { flex-wrap: wrap; }
  .circle-block .guide-picker button { flex: 1 1 auto; }
  .circle .axis.guide-degree { font-size: 9px; }
  .circle .grid { fill: none; stroke: var(--line); }
  .circle .spoke { stroke: var(--soft); stroke-opacity: 0.5; }
  .circle .spoke.half { stroke-dasharray: 3 4; stroke-opacity: 0.35; }
  .circle .mark { stroke: color-mix(in oklch, var(--fg) 45%, transparent); stroke-width: 1.5; }
  .circle .ring { stroke-width: 2.5; }
  /* Under the pointer a dot shows it's the one named: its outline turns to the text color, a ring thickens. */
  .circle .mark:hover { stroke: var(--fg); }
  .circle .ring:hover { stroke-width: 4; }
  .circle .dot-label { visibility: hidden; pointer-events: none; fill: var(--fg); font: 600 12px var(--sans); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .circle .dot-label.shown { visibility: visible; }
  .circle .key-mark { fill: var(--soft); }
  .circle .axis { fill: var(--soft); font: 500 11px var(--sans); }
  .facts-list { display: grid; gap: 0.75rem; margin: 0; }
  .facts-list div { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; border-bottom: 1px solid var(--line); padding-bottom: 0.75rem; }
  .facts-list dt { color: var(--soft); }
  .facts-list dd { margin: 0; }
  .sources { margin: 0; padding-left: 1.75rem; display: grid; gap: 1rem; max-width: 46rem; }
  .sources li { padding-left: 0.25rem; }
  .sources li::marker { color: var(--soft); font-variant-numeric: tabular-nums; }
  .sources p { margin: 0; }
  .sources a { overflow-wrap: anywhere; }
  .legend { display: grid; gap: 0.75rem; }
  .key { display: inline-block; width: 0.875rem; height: 0.875rem; border-radius: 50%; background: var(--fg); vertical-align: -0.125rem; margin-left: 0.75rem; }
  .key.hollow { background: none; box-shadow: inset 0 0 0 2.5px var(--fg); margin-left: 0; }

  /* Color pages */
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chips a { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; padding: 0.375rem 0.75rem; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); }
  .chips a[aria-current] { background: var(--raised); box-shadow: inset 0 0 0 1.5px var(--c); }
  .chips a:not([aria-current]):hover { background: var(--hover); }
  .dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--c); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 52rem; }
  th, td { text-align: left; padding: 0.625rem 0.75rem 0.625rem 0; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  thead th { font-size: 0.75rem; font-weight: 500; color: var(--soft); text-transform: uppercase; letter-spacing: 0.06em; }
  thead .pop-trigger { text-transform: inherit; letter-spacing: inherit; }
  .compact thead .unit { display: none; }
  tbody th { font-weight: 600; }
  tbody th .soft { display: block; font-size: 0.75rem; }
  .pair { display: inline-flex; align-items: center; gap: 0.625rem; }
  .pair .fill { width: 2.5rem; height: 1.75rem; margin: 0; border-radius: 0.375rem; }
  .pair .sample { font-size: 1.5rem; }

  /* Compare */
  /* A pair holds two cards as wide as the tier cards, and the gap between them. */
  .pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(23.5rem, 1fr)); gap: 1.5rem; }
  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .versus h3 { grid-column: 1 / -1; }
  .bar-row { display: grid; grid-template-columns: 9rem 1fr 3rem; gap: 0.75rem; align-items: center; padding-block: 0.25rem; font-size: 0.875rem; }
  .bar { height: 0.5rem; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--fg); border-radius: inherit; }

  /* Settings */
  .group { padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .field { display: grid; grid-template-columns: 9rem minmax(0, 1fr) 5.5rem; gap: 1rem; align-items: center; max-width: 36rem; }
  .field:not(:has(input[type="range"])) { grid-template-columns: 9rem 7rem; }
  .field input[type="number"], .field input[type="text"], .field select { font: inherit; font-family: var(--mono); font-size: 0.875rem; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.375rem 0.5rem; width: 100%; }
  .field input[type="checkbox"] { justify-self: start; }
  .split .field { grid-template-columns: 7rem 6rem; }
  .split > div { display: grid; gap: 0.5rem; align-content: start; }
  .checks { display: flex; flex-wrap: wrap; gap: 1rem; }
  .extra { display: grid; gap: 0.75rem; }
  .extra-title { display: flex; gap: 0.75rem; align-items: baseline; justify-content: space-between; margin: 0; }
  .extra-name { display: inline-flex; gap: 0.5rem; align-items: center; }
  .extra-name .soft { font-weight: 400; font-size: 0.875rem; }
  .demo .strip { position: static; padding-block: 0; background: none; }
  .demo .strip-items { grid-template-columns: repeat(auto-fit, minmax(1.375rem, 1fr)); }
  .strip { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-height, 7rem) - 1px); z-index: 4; background: var(--bg); border-bottom: 1px solid transparent; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.75rem; align-items: start; padding-block: 0.75rem; }
  .graph-editor { max-width: 56rem; display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 0.75rem 1.5rem; align-items: center; }
  .graph-values { display: grid; gap: 0.5rem; align-content: center; }
  .graph-values .field, .graph-values .field:not(:has(input[type="range"])) { grid-template-columns: 3.5rem minmax(0, 1fr); gap: 0.5rem; }
  .graph-values .graph-check { grid-template-columns: 3.5rem auto; }
  .graph-values > p { margin: 0; }
  .graph-editor svg { width: 100%; display: block; overflow: visible; touch-action: none; user-select: none; -webkit-user-select: none; }
  .graph-band { opacity: 0.28; }
  .graph-caption { grid-column: 2; margin: 0 var(--graph-inset-end, 0) 0 var(--graph-inset, 0); max-width: none; font-size: 0.8125rem; }
  .graph-editor .grid { stroke: var(--line); }
  .graph-editor .axis { fill: var(--soft); font: 500 8px var(--sans); }
  .graph-editor .mark { stroke: color-mix(in oklch, var(--fg) 45%, transparent); stroke-width: 1; }
  .graph-editor .hit { fill: transparent; }
  .guide { stroke: var(--fg); stroke-opacity: 0.22; stroke-width: 1; }
  .guide.half { stroke-opacity: 0.12; stroke-dasharray: 3 3; }
  .graph-editor .guide-label { fill: var(--fg); }
  .graph-editor .guide-degree { font-size: 7px; }
  .guide-row { grid-column: 2; display: flex; gap: 0.5rem; align-items: center; margin: 0 var(--graph-inset-end, 0) -0.625rem var(--graph-inset, 0); }
  .guide-picker { flex: 1; display: flex; min-width: 0; }
  .guide-info { flex: none; width: 1.75rem; height: 1.75rem; padding: 0; border-radius: 50%; color: var(--soft); }
  .guide-info:hover, .guide-info[aria-expanded="true"] { color: var(--fg); }
  .graph-caption.readout { font-size: 0.875rem; color: var(--fg); }
  .graph-caption.hint { font-size: 0.75rem; color: var(--soft); }
  .guide-picker button { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .graph-editor .hue-gap { font-size: 7px; }
  .graph-editor .hue-gap.extreme { fill: var(--fg); font-weight: 700; }
  .hue-point.uniform .dot-fill { stroke: color-mix(in oklch, var(--fg) 45%, transparent); stroke-width: 1; }
  .hue-point.uniform { cursor: pointer; }
  .hue-point.uniform.selected .dot-fill { stroke: var(--fg); stroke-width: 2; }
  .hue-note { margin: 0; font-size: 0.8125rem; }
  .curve-editor svg { cursor: crosshair; }
  .curve-editor .zero { stroke: var(--soft); stroke-opacity: 0.6; }
  .curve-point { cursor: grab; outline: none; }
  .curve-point circle:last-child { fill: var(--fg); stroke: var(--bg); stroke-width: 2; }
  .curve-point:focus-visible circle:last-child { stroke: var(--focus); stroke-width: 3; }
  .curve-point.off circle:last-child { fill: var(--bg); stroke: var(--soft); stroke-width: 1.5; stroke-dasharray: 2 2; }
  .curve-edge { cursor: ew-resize; }
  .curve-edge rect:last-child { fill: var(--fg); }
  .curve-line { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; }
  .hue-point { cursor: ew-resize; outline: none; }
  .hue-point .dot-fill { stroke: var(--bg); stroke-width: 1.5; }
  .hue-point.selected .dot-fill { stroke: var(--fg); stroke-width: 2; }
  .hue-point:focus-visible .dot-fill { stroke: var(--focus); stroke-width: 2.5; }
  .hue-point .pin { fill: var(--bg); pointer-events: none; }
  .hue-path { fill: none; stroke: var(--fg); stroke-opacity: 0.4; stroke-width: 1; }
  .hue-name { display: flex; gap: 0.375rem; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .hue-name .soft { font-weight: 400; font-size: 0.8125rem; }
  .hue-facts { margin: 0; display: grid; gap: 0.25rem; font-size: 0.8125rem; }
  .hue-facts div { display: grid; grid-template-columns: 3.5rem minmax(0, 1fr); gap: 0.5rem; }
  .hue-facts dt { color: var(--soft); }
  .hue-facts dd { margin: 0; }
  .field.wide, .field.wide:not(:has(input[type="range"])) { grid-template-columns: 9rem 13rem; }
  .strip.docked { border-bottom-color: var(--line); }
  .strip-metrics { display: grid; grid-template-columns: repeat(3, 5ch); width: calc(15ch + 1.5rem); grid-template-rows: repeat(4, 1rem) auto; column-gap: 0.75rem; align-items: center; justify-items: end; font-size: 0.6875rem; }
  .strip-metrics .head { color: var(--soft); }
  .strip-metrics .metric-scope { grid-column: 1 / -1; justify-self: stretch; margin-top: 0.375rem; color: var(--soft); display: flex; gap: 0.4rem; align-items: center; white-space: nowrap; overflow: hidden; }
  .strip-metrics .metric-scope .bend-meter { flex: 1; }
  .strip-metrics .scope-text { display: inline-flex; gap: 0.3rem; align-items: center; }
  .strip-metrics .dot { width: 0.5rem; height: 0.5rem; }
  .pop-trigger.metric, .pop-trigger.metric-scope { font: inherit; color: inherit; background: none; border: 0; border-radius: 0.25rem; padding: 0; cursor: pointer; }
  .pop-trigger.strip-gap { font: inherit; background: none; border: 0; border-radius: 0.25rem; padding: 0; text-align: left; cursor: pointer; }
  #popover { position: fixed; top: 0; left: 0; z-index: 20; width: min(24rem, calc(100vw - 1rem)); max-height: min(34rem, calc(100vh - 1rem)); overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 0.5rem; padding: 0.875rem 1rem; border-radius: 0.75rem; background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px var(--line), 0 0.75rem 2rem var(--shadow); font-size: 0.8125rem; line-height: 1.45; }
