<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EK Colors</title>
<meta name="description" content="An accessible color palette solved in CAM16: every color exactly on its APCA contrast, equally colorful and evenly spaced, for light and dark and three kinds of screen.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* One view at a time on the mode's own base: the page is the background the colors are solved for. */
  :root {
    --base-light: #EBEBEB;
    --base-dark: #181818;
    --bg: var(--base-light);
    --fg: #1C1D20;
    --soft: #5E6066;
    --line: rgb(28 29 32 / 0.14);
    --raised: rgb(255 255 255 / 0.55);
    --focus: #0A62C9;
    --good: #1F7A3A;
    --fair: #8A6100;
    --poor: #B3261E;
    --sans: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--base-dark); --fg: #E7E8EA; --soft: #9C9EA4; --line: rgb(231 232 234 / 0.14);
      --raised: rgb(255 255 255 / 0.05); --focus: #6FB1FF; --good: #6CCB86; --fair: #E0B455; --poor: #FF8A80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--base-dark); --fg: #E7E8EA; --soft: #9C9EA4; --line: rgb(231 232 234 / 0.14);
    --raised: rgb(255 255 255 / 0.05); --focus: #6FB1FF; --good: #6CCB86; --fair: #E0B455; --poor: #FF8A80;
    color-scheme: dark;
  }

  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 1rem/1.5 var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: background-color 0.2s;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  .soft { color: var(--soft); font-weight: 400; }

  /* Bar */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); border-bottom: 1px solid var(--line);
    /* Name on the left, views centered, status on the right; the switches below, centered too. */
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 0.5rem 1.5rem;
    padding-block: 0.75rem; max-width: 72rem; margin: 0 auto;
  }
  .brand { justify-self: start; font-weight: 600; text-decoration: none; letter-spacing: -0.01em; }
  .nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem; }
  .nav a { text-decoration: none; padding: 0.375rem 0.625rem; border-radius: 0.5rem; color: var(--soft); }
  .nav a:hover { color: var(--fg); }
  .nav a[aria-current] { color: var(--fg); background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
  .tools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
  #status { justify-self: end; font-size: 0.8125rem; color: var(--soft); }
  .menu-toggle { display: none; }
  #status[data-state="busy"]::before { content: "● "; color: var(--fair); }
  #status[data-state="error"] { color: var(--poor); }

  .segmented { display: inline-flex; border-radius: 0.5rem; box-shadow: inset 0 0 0 1px var(--line); padding: 2px; }
  button { font: inherit; font-size: 0.875rem; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.375rem 0.75rem; cursor: pointer; }
  .segmented button { border: 0; background: none; color: var(--soft); padding: 0.25rem 0.625rem; border-radius: 0.375rem; }
  .segmented button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }

  /* Page */
  main { max-width: 72rem; margin: 0 auto; padding-block: 2rem 4rem; display: grid; gap: 3rem; }
  section { display: grid; gap: 1rem; min-width: 0; }
  h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; margin: 0; text-wrap: balance; }
  h2 { font-size: 1.25rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h3 { font-size: 0.8125rem; font-weight: 500; margin: 0; text-transform: uppercase; letter-spacing: 0.06em; color: var(--soft); }
  p { margin: 0; max-width: 65ch; }
  .intro { gap: 0.75rem; }
  .intro p { font-size: 1.0625rem; color: var(--soft); }
  .hero h1 { color: var(--c); }

  /* Cards: the color as a fill, as text, and its numbers */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 1rem; }
  .cards.small { grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); }
  .card { display: grid; gap: 0.25rem; align-content: start; text-decoration: none; padding: 0.75rem; border-radius: 0.875rem; box-shadow: inset 0 0 0 1px var(--line); }
  a.card:hover { background: var(--raised); }
  .fill { display: block; height: 3.5rem; border-radius: 0.5rem; background: var(--c); margin-bottom: 0.25rem; }
  .small .fill { height: 2.25rem; }
  .sample { color: var(--c); font-size: 2rem; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  .small .sample { font-size: 1.5rem; }
  .card-name { font-weight: 600; }
  .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
  .card .soft.mono { font-size: 0.75rem; }
  .limit { color: var(--fair); font-size: 0.75rem; font-weight: 500; }
  .card .value { font-size: 0.6875rem; overflow-wrap: anywhere; }
  .segmented button[title="Your screen"]::after { content: " •"; color: var(--good); }
  .beyond { max-width: 72rem; margin: 1rem auto 0; padding: 0.625rem 0.875rem; border-radius: 0.625rem; box-shadow: inset 0 0 0 1px var(--fair); color: var(--fair); font-size: 0.875rem; }

  .badge { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em; padding: 0.0625rem 0.375rem; border-radius: 999px; box-shadow: inset 0 0 0 1px currentColor; white-space: nowrap; }
  .badge[data-level="AAA"], .badge[data-level="AA"] { color: var(--good); }
  .badge[data-level="AA-large"] { color: var(--fair); }
  .badge[data-level="below"] { color: var(--soft); }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; align-items: center; }
  .split.even { align-items: start; }
  .circle { width: 100%; max-width: 26rem; display: block; margin: 0 auto; }
  .circle .grid { fill: none; stroke: var(--line); }
  .circle .spoke { stroke: var(--soft); stroke-opacity: 0.5; }
  .circle .spoke.half { stroke-dasharray: 3 4; stroke-opacity: 0.35; }
  .circle .mark { stroke: color-mix(in oklch, var(--fg) 45%, transparent); stroke-width: 1.5; }
  .circle .key-mark { fill: var(--soft); }
  .circle .axis { fill: var(--soft); font: 500 11px var(--sans); }
  .facts-list { display: grid; gap: 0.75rem; margin: 0; }
  .facts-list div { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; border-bottom: 1px solid var(--line); padding-bottom: 0.75rem; }
  .facts-list dt { color: var(--soft); }
  .facts-list dd { margin: 0; }
  .legend { display: grid; gap: 0.75rem; }
  .key { display: inline-block; width: 0.875rem; height: 0.875rem; border-radius: 50%; background: var(--fg); vertical-align: -0.125rem; margin-left: 0.75rem; }
  .key.hollow { background: none; box-shadow: inset 0 0 0 2.5px var(--fg); margin-left: 0; }

  /* Color pages */
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chips a { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; padding: 0.375rem 0.75rem; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); }
  .chips a[aria-current] { background: var(--raised); box-shadow: inset 0 0 0 1.5px var(--c); }
  .dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--c); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 52rem; }
  th, td { text-align: left; padding: 0.625rem 0.75rem 0.625rem 0; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  thead th { font-size: 0.75rem; font-weight: 500; color: var(--soft); text-transform: uppercase; letter-spacing: 0.06em; }
  tbody th { font-weight: 600; }
  tbody th .soft { display: block; font-size: 0.75rem; }
  .pair { display: inline-flex; align-items: center; gap: 0.625rem; }
  .pair .fill { width: 2.5rem; height: 1.75rem; margin: 0; border-radius: 0.375rem; }
  .pair .sample { font-size: 1.5rem; }

  /* Compare */
  .pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 1.5rem; }
  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .versus h3 { grid-column: 1 / -1; }
  .bar-row { display: grid; grid-template-columns: 9rem 1fr 3rem; gap: 0.75rem; align-items: center; padding-block: 0.25rem; font-size: 0.875rem; }
  .bar { height: 0.5rem; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--fg); border-radius: inherit; }

  /* Settings */
  .group { padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .field { display: grid; grid-template-columns: 9rem minmax(0, 1fr) 5.5rem; gap: 1rem; align-items: center; max-width: 36rem; }
  .field:not(:has(input[type="range"])) { grid-template-columns: 9rem 7rem; }
  .field input[type="number"], .field input[type="text"], .field select { font: inherit; font-family: var(--mono); font-size: 0.875rem; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.375rem 0.5rem; width: 100%; }
  .field input[type="checkbox"] { justify-self: start; }
  .split .field { grid-template-columns: 7rem 6rem; }
  .split > div { display: grid; gap: 0.5rem; align-content: start; }
  .checks { display: flex; flex-wrap: wrap; gap: 1rem; }
  .strip { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-height, 7rem)); z-index: 4; background: var(--bg); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.75rem; align-items: start; padding-block: 0.75rem; }
  .curve-editor { max-width: 52rem; display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 1rem 1.5rem; align-items: center; }
  .curve-values { display: grid; gap: 0.5rem; }
  .curve-values .field, .curve-values .field:not(:has(input[type="range"])) { grid-template-columns: 3.5rem minmax(0, 1fr); gap: 0.5rem; }
  .curve-editor svg { width: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .curve-band { opacity: 0.28; }
  .curve-caption { grid-column: 2; margin: 0; font-size: 0.8125rem; }
  .curve-editor .grid { stroke: var(--line); }
  .curve-editor .reference { stroke: var(--fg); stroke-opacity: 0.35; }
  .curve-editor .reference.half { stroke-dasharray: 3 4; stroke-opacity: 0.25; }
  .curve-editor .zero { stroke: var(--soft); stroke-opacity: 0.6; }
  .curve-editor .axis { fill: var(--soft); font: 500 9px var(--sans); }
  .curve-line { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; }
  .curve-editor .mark { stroke: color-mix(in oklch, var(--fg) 45%, transparent); stroke-width: 1.2; }
  .curve-editor .hit { fill: transparent; }
  .curve-point { cursor: grab; outline: none; }
  .curve-point circle:last-child { fill: var(--fg); stroke: var(--bg); stroke-width: 2; }
  .curve-point:focus-visible circle:last-child { stroke: var(--focus); stroke-width: 3; }
  .curve-edge { cursor: ew-resize; }
  .curve-edge rect:last-child { fill: var(--fg); }
  .strip-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(3.5rem, 1fr)); gap: 0.5rem; }
  .strip-labels { display: grid; grid-template-rows: 1.25rem 1.25rem; align-items: center; font-size: 0.75rem; color: var(--soft); text-align: right; }
  .strip-item.changed .mono { font-weight: 700; }
  .strip-item { display: grid; gap: 0; }
  .strip-item .fill { height: 1.25rem; margin: 0; border-radius: 0; }
  .strip-item .before { background: var(--b); border-radius: 0.5rem 0.5rem 0 0; }
  .strip-item .after { border-radius: 0 0 0.5rem 0.5rem; margin-bottom: 0.25rem; }
  .strip-item .mono { font-size: 0.6875rem; color: var(--c); font-weight: 500; }

  /* How it works */
  .step { max-width: 46rem; }
  .step p { font-size: 1.0625rem; line-height: 1.6; }
  .step a { color: var(--focus); }
  .demo { display: grid; gap: 1rem; padding: 1.25rem; border-radius: 1rem; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
  .demo-controls { display: flex; flex-wrap: wrap; gap: 1rem 2rem; }
  .demo-controls label { display: grid; gap: 0.375rem; font-size: 0.875rem; color: var(--soft); min-width: min(16rem, 100%); }
  .demo-controls select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.375rem 0.5rem; }
  .demo-out { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.75rem 1.25rem; align-items: center; min-height: 6rem; }
  .demo-out.wide { display: block; min-height: 0; }
  .demo-out > p, .demo-out > .demo-numbers { grid-column: 1 / -1; }
  .demo-swatch { width: 4.5rem; height: 4.5rem; border-radius: 0.75rem; background: var(--c); }
  .demo-sample { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .demo-numbers { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin: 0; }
  .demo-numbers div { display: grid; }
  .demo-numbers dt { font-size: 0.75rem; color: var(--soft); }
  .demo-numbers dd { margin: 0; }
  .demo-pair { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .demo-pair figure { margin: 0; display: grid; gap: 0.5rem; }
  .demo-pair figcaption { display: grid; gap: 0.125rem; font-size: 0.875rem; }
  .demo-swatch.empty { background: repeating-linear-gradient(45deg, var(--line) 0 6px, transparent 6px 12px); }
  .demo-verdict { margin-top: 0.75rem; }
  .demo-touch { display: flex; height: 4.5rem; border-radius: 0.75rem; overflow: hidden; }
  .demo-touch span { flex: 1; background: var(--c); }
  .demo-out.wide > * + * { margin-top: 0.875rem; }
  .scale { position: relative; height: 0.5rem; border-radius: 999px; background: var(--line); margin-bottom: 1.75rem; }
  .scale-fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--fg); }
  .scale-mark { position: absolute; top: -0.25rem; bottom: -0.25rem; width: 2px; background: var(--fair); }
  .scale-mark span { position: absolute; top: 1.25rem; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 0.75rem; color: var(--soft); }
  .chart .other { opacity: 0.5; }
  .on-base { margin: 0; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0.75rem 1rem; padding: 1rem; border-radius: 0.75rem; background: var(--base); box-shadow: inset 0 0 0 1px var(--line); }
  .on-base figcaption { grid-column: 1 / -1; display: grid; gap: 0.125rem; font-size: 0.875rem; color: var(--ink); }
  .on-base-sample { color: var(--c); font-size: 2.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .chart .follower { opacity: 0.55; }
  .chart .limiter .label { fill: var(--fair); font-weight: 600; }
  table.roles { min-width: 0; width: auto; }
  .chart { width: 100%; display: block; }
  .chart .grid { stroke: var(--line); }
  .chart .axis { fill: var(--soft); font: 500 11px var(--sans); }
  .chart .label { font-size: 12px; fill: var(--fg); }
  .chart .target { stroke: var(--soft); stroke-dasharray: 4 4; stroke-width: 1.5; }
  .chart .ceiling { stroke: var(--fair); stroke-width: 2; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; font-size: 0.8125rem; margin-top: 0.75rem; }
  .bar-key { display: inline-block; width: 1rem; height: 0.375rem; border-radius: 999px; background: var(--fg); margin-right: 0.375rem; vertical-align: middle; }
  .line-key { display: inline-block; width: 1rem; margin-right: 0.375rem; vertical-align: middle; border-top: 2px solid var(--fair); }
  .line-key.target { border-top: 2px dashed var(--soft); }

  /* Blind test */
  .checklist { margin: 0; padding-left: 1.25rem; display: grid; gap: 0.25rem; }
  .test-stage { justify-items: center; text-align: center; gap: 1.25rem; }
  .test-pair { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(1rem, 4vw, 2.5rem); width: min(100%, 36rem); }
  .test-swatch { aspect-ratio: 1; border: 0; padding: 0; border-radius: 1rem; background: var(--c); cursor: pointer; }
  .test-pair.resting .test-swatch { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .test-answers { justify-content: center; }
  button.link { background: none; border: 0; padding: 0; color: var(--soft); text-decoration: underline; font-size: inherit; }
  #test-code { font: inherit; font-family: var(--mono); font-size: 0.8125rem; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.375rem 0.5rem; min-width: 0; flex: 1 1 12rem; }
  .test-runs { margin: 0; padding-left: 1.25rem; display: grid; gap: 0.5rem; }
  table.test-results { min-width: 0; width: auto; }
  .test-results tr.clear th, .test-results tr.clear td:not(.soft) { font-weight: 700; }
  a.button { display: inline-block; text-decoration: none; font-size: 0.875rem; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.375rem 0.75rem; }

  /* Export */
  .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
  textarea { width: 100%; min-height: 28rem; font-family: var(--mono); font-size: 0.75rem; line-height: 1.5; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 0.75rem; padding: 1rem; resize: vertical; }

  @media (max-width: 48rem) {
    .curve-editor { grid-template-columns: minmax(0, 1fr); }
    .curve-values { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .curve-values > p { grid-column: 1 / -1; }
    .curve-caption { grid-column: 1; }
    .curve-values .field, .curve-values .field:not(:has(input[type="range"])) { grid-template-columns: minmax(0, 1fr); gap: 0.25rem; }
    /* Phones: name, status and the menu button on one line, the views in a dropdown, the switches below. */
    header { grid-template-columns: minmax(0, 1fr) auto auto; gap: 0.375rem 0.75rem; padding-block: 0.5rem; }
    #status { order: 1; }
    .menu-toggle { order: 1; display: inline-grid; gap: 3px; align-content: center; width: 2rem; height: 2rem; padding: 0 0.4375rem; border-radius: 0.5rem; }
    .menu-toggle span { display: block; height: 2px; border-radius: 1px; background: var(--fg); transition: transform 0.2s, opacity 0.2s; }
    .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }
    .nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; gap: 0.125rem; padding-block: 0.5rem; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 0.75rem 1.5rem rgb(0 0 0 / 0.18); }
    header.menu-open .nav { display: flex; }
    .nav a { padding: 0.625rem 0.75rem; }
    .tools { grid-column: 1 / -1; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
    .tools::-webkit-scrollbar { display: none; }
    /* A soft edge on whichever side has more to scroll to. */
    .fade-start { -webkit-mask-image: linear-gradient(to right, transparent, #000 2rem); mask-image: linear-gradient(to right, transparent, #000 2rem); }
    .fade-end { -webkit-mask-image: linear-gradient(to left, transparent, #000 2rem); mask-image: linear-gradient(to left, transparent, #000 2rem); }
    .fade-start.fade-end { -webkit-mask-image: linear-gradient(to right, transparent, #000 2rem, #000 calc(100% - 2rem), transparent); mask-image: linear-gradient(to right, transparent, #000 2rem, #000 calc(100% - 2rem), transparent); }
    .tools { order: 3; gap: 0.25rem; }
    /* Auto margins on the first and last shown switch keep them centered, and give way when they scroll. */
    .tools > :nth-child(1 of :not([hidden])) { margin-left: auto; }
    .tools > :nth-last-child(1 of :not([hidden])) { margin-right: auto; }
    .segmented { flex: none; }
    .segmented { padding: 1px; }
    .segmented button { padding: 0.125rem 0.375rem; font-size: 0.75rem; line-height: 1.4; }
    .split { grid-template-columns: minmax(0, 1fr); }
    .facts-list div { grid-template-columns: 8rem 1fr; }
    .field { grid-template-columns: 7rem minmax(0, 1fr) 4.5rem; }

    .strip { gap: 0.25rem; padding-block: 0.5rem; }
