  /* One view at a time on the mode's own base: the page is the background the colors are solved for. */
  :root {
    --base-light: #EBEBEB;

  :where(a, button.link, .copy, .pop-trigger:is(.wanted, .metric, .metric-scope, .strip-gap, .id-note), .strip-labels button) { text-decoration: underline dotted color-mix(in oklch, currentColor 45%, transparent); text-underline-offset: 0.2em; }

  :is(.tool-info, .guide-info, .icon-button) { flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; color: var(--soft); font-size: var(--type-md); line-height: 1; }
  :is(.tool-info, .guide-info, .icon-button):is(:hover:not(:disabled), [aria-expanded="true"]) { color: var(--fg); }

  /* One control look: buttons, fields, dropdowns and text boxes; fields and boxes write in mono. */
  button, a.button, .field :is(input[type="number"], input[type="text"], select), .demo-controls select, .test-code, textarea { font: inherit; font-size: var(--type-md); color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-control); padding: var(--space-3) var(--space-5); }

  /* Under the pointer: buttons, dropdowns and text fields add the hover fill over their own; a toggle that isn't

  button:where(:hover:not(:disabled)), a.button:hover, select:hover:not(:disabled), input:is([type="number"], [type="text"]):hover:not(:disabled), textarea:hover { background: linear-gradient(var(--hover), var(--hover)), var(--raised); }
  /* Buttons that read as text or as a mark: no box of their own, the text around them, hovered or not. */
  button:where(.tool-info, .guide-info, .icon-button, .segmented button, .pop-trigger.wanted, .tier-pick, .pop-trigger.id-note, .pop-trigger.id-mark, .copy, .pop-trigger.metric, .pop-trigger.metric-scope, .pop-trigger.strip-gap, .strip-labels button, .test-swatch, .link) { font: inherit; background: none; border: 0; padding: 0; }

  section { display: grid; gap: var(--space-6); min-width: 0; }

  .tier-pick { color: inherit; text-align: left; border-radius: var(--radius-control); padding: var(--space-1) var(--space-3); margin-inline: calc(-1 * var(--space-3)); cursor: pointer; }
